<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover"/>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Atelier AI | Pro</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <style>
        :root { --accent: #3b82f6; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .glass { background: rgba(23, 23, 25, 0.7); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .safe-pb { padding-bottom: env(safe-area-inset-bottom); }
        .split-pane { transition: width 0.3s ease; }
        body { background-color: #0c0c0e; color: #e4e2e4; font-family: 'Inter', sans-serif; height: 100dvh; overflow: hidden; }
        input, select, textarea { background: rgba(0,0,0,0.2) !important; border: 1px solid rgba(255,255,255,0.05) !important; color: white !important; }
        .debug-scroll { font-family: 'Courier New', monospace; font-size: 11px; }
        /* Ensure checkboxes show a clear active state */
input[type="checkbox"]:checked {
    background-color: #3b82f6 !important; /* blue-600 */
    background-image: url("data:image/svg+xml,%3csvg viewBox='0 0 16 16' fill='white' xmlns='http://www.w3.org/2000/svg'%3e%3cpath d='M12.207 4.793a1 1 0 010 1.414l-5 5a1 1 0 01-1.414 0l-2-2a1 1 0 011.414-1.414L6.5 9.086l4.293-4.293a1 1 0 011.414 0z'/%3e%3c/svg%3e") !important;
    border-color: transparent !important;
}

/* Fix for iOS Safari appearance */
input[type="checkbox"] {
    appearance: none;
    -webkit-appearance: none;
    print-color-adjust: exact;
    display: inline-block;
    vertical-align: middle;
    background-origin: border-box;
    user-select: none;
    flex-shrink: 0;
}
    </style>
</head>
<body class="flex flex-col">

    <header class="glass fixed top-0 w-full z-50 flex justify-between items-center px-6 py-4 border-b border-white/5 pt-[env(safe-area-inset-top)]">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center shadow-lg shadow-blue-500/20">
                <span class="material-symbols-outlined text-white text-xl">temp_preferences_custom</span>
            </div>
            <h1 class="text-sm font-bold tracking-[0.3em] uppercase font-['Space_Grotesk'] text-blue-200">Atelier AI</h1>
        </div>
        <div class="flex gap-2">
            <button onclick="toggleDebug()" class="w-10 h-10 rounded-full flex items-center justify-center hover:bg-white/5 transition-colors">
                <span class="material-symbols-outlined text-zinc-500">terminal</span>
            </button>
        </div>
    </header>

    <main id="view-container" class="flex-1 mt-20 mb-20 overflow-hidden relative">
        
        <section id="view-editor" class="h-full flex flex-col md:flex-row">
            <div class="md:hidden flex w-full border-b border-white/5 shrink-0 bg-[#0c0c0e] z-10">
                <button onclick="switchMobileTab('inputs')" id="tab-inputs" class="flex-1 py-3 text-[10px] font-bold uppercase tracking-widest text-blue-400 border-b-2 border-blue-500 transition-colors">Editor</button>
                <button onclick="switchMobileTab('preview')" id="tab-preview" class="flex-1 py-3 text-[10px] font-bold uppercase tracking-widest text-zinc-500 border-b-2 border-transparent transition-colors">Preview</button>
            </div>

            <aside id="editor-inputs" class="w-full md:w-80 flex-1 md:flex-none md:h-full border-r border-white/5 p-6 overflow-y-auto hide-scrollbar flex flex-col gap-8 bg-[#0c0c0e]">
                
                <div>
                    <label class="text-[10px] font-bold tracking-widest text-zinc-500 uppercase mb-4 block">Source Image</label>
                    <div id="dropZone" onclick="document.getElementById('fileInput').click()" class="h-64 w-full rounded-2xl border-2 border-dashed border-white/10 flex flex-col items-center justify-center cursor-pointer hover:bg-white/5 transition-all relative overflow-hidden group">
                        <img id="sourcePreview" class="absolute inset-0 w-full h-full object-contain bg-black/50 hidden">
                        <span class="material-symbols-outlined text-zinc-600 mb-2">add_a_photo</span>
                        <p class="text-[10px] text-zinc-500 font-medium">TAP TO UPLOAD</p>
                        <input type="file" id="fileInput" hidden accept="image/*" multiple onchange="handleFile(event)">
                    </div>
                </div>

                <div>
                    <div class="flex justify-between items-center mb-4">
                        <label class="text-[10px] font-bold tracking-widest text-zinc-500 uppercase">Enhancements</label>
                        <button onclick="openEnhancerModal()" class="text-blue-400 text-[10px] font-bold hover:text-blue-300 transition-colors">+ ADD</button>
                    </div>
                    <div id="enhancerList" class="space-y-2">
                        </div>
                </div>

                <div class="space-y-4">
                    <div>
                        <label class="text-[10px] font-bold tracking-widest text-zinc-500 uppercase mb-2 block">Base Description</label>
                        <textarea id="basePrompt" class="w-full h-24 rounded-xl p-3 text-xs leading-relaxed resize-none" placeholder="AI Analysis will appear here..."></textarea>
                    </div>
                    <div>
                        <div class="flex justify-between items-center mb-2">
                            <label class="text-[10px] font-bold tracking-widest text-blue-400 uppercase block">Enhanced Prompt</label>
                            <button id="diffBtn" onclick="toggleDiff()" class="text-[10px] font-bold text-zinc-500 hover:text-blue-400 transition-colors">SHOW DIFF</button>
                        </div>
                        <div class="relative">
                            <textarea id="finalPrompt" class="w-full h-32 rounded-xl p-3 text-xs leading-relaxed border-blue-500/20 bg-blue-500/5 transition-opacity" placeholder="Final generation instructions..."></textarea>
                            <div id="diffOutput" class="absolute inset-0 w-full h-32 rounded-xl p-3 text-xs leading-relaxed border border-blue-500/20 bg-zinc-900 overflow-y-auto whitespace-pre-wrap hidden"></div>
                        </div>
                    </div>
                </div>

                <div class="mt-auto pt-4 space-y-3">
                    <div class="flex items-center gap-3 px-2">
                        <input type="checkbox" id="autoGenerate" class="rounded bg-white/5 border-white/10 text-blue-500 focus:ring-offset-0 focus:ring-blue-500 w-5 h-5 transition-colors">
                        <label for="autoGenerate" class="text-[10px] text-zinc-400 font-bold uppercase">Auto-Generate</label>
                    </div>
                    <button id="mainActionBtn" onclick="runAnalyze()" class="w-full py-4 bg-blue-600 text-white rounded-2xl font-bold text-sm tracking-tight flex items-center justify-center gap-3 active:scale-95 transition-all shadow-xl shadow-blue-500/20">
                        <span class="material-symbols-outlined">analytics</span>
                        ANALYZE & ENHANCE
                    </button>
                    <button id="genBtn" onclick="runGenerate()" class="w-full py-4 bg-zinc-800 text-white rounded-2xl font-bold text-sm tracking-tight flex items-center justify-center gap-3 active:scale-95 transition-all">
                        <span class="material-symbols-outlined">auto_awesome</span>
                        GENERATE IMAGE
                    </button>
                </div>
            </aside>

            <div id="editor-preview" class="hidden md:flex flex-1 h-full bg-black relative overflow-hidden shrink-0">
                <div class="absolute top-6 left-1/2 -translate-x-1/2 z-30">
                    <button onclick="toggleCompare()" class="glass px-4 py-2 rounded-full border border-white/10 flex items-center gap-2 hover:bg-white/10 transition-colors shadow-xl">
                        <span class="material-symbols-outlined text-xs text-zinc-400">compare</span>
                        <span id="cmpBtnText" class="text-[10px] font-bold text-zinc-300 uppercase tracking-widest">COMPARE</span>
                    </button>
                </div>

                <div id="compareView" class="absolute inset-0 hidden bg-black z-20">
                    <img id="cmp-before" class="absolute inset-0 w-full h-full object-contain">
                    <img id="cmp-after" class="absolute inset-0 w-full h-full object-contain">
                    <div id="cmp-line" class="absolute top-0 bottom-0 w-0.5 bg-white cursor-ew-resize z-20 pointer-events-none shadow-[0_0_20px_rgba(0,0,0,0.5)]" style="left: 50%">
                        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-8 h-8 bg-white rounded-full flex items-center justify-center shadow-lg"><span class="material-symbols-outlined text-black text-sm">code</span></div>
                    </div>
                    <input type="range" min="0" max="100" value="50" class="absolute inset-0 w-full h-full opacity-0 cursor-ew-resize z-30" oninput="updateCompare(this.value)">
                </div>

                <div id="splitContainer" class="w-full h-full flex flex-col md:flex-row">
                    <div class="flex-1 relative border-r border-white/5">
                        <img id="view-original" class="w-full h-full object-contain opacity-40">
                        <div class="absolute top-6 left-6 glass px-4 py-2 rounded-full border border-white/10">
                            <span class="text-[10px] font-bold tracking-widest uppercase">Source</span>
                        </div>
                    </div>
                    <div class="flex-1 relative bg-zinc-900/20">
                        <img id="view-result" class="w-full h-full object-contain">
                        <div id="loader" class="absolute inset-0 glass flex flex-col items-center justify-center hidden">
                            <div class="w-10 h-10 border-2 border-blue-500 border-t-transparent rounded-full animate-spin mb-4"></div>
                            <p id="loaderStatus" class="text-xs font-bold tracking-[0.2em] text-blue-400 mt-4">PROCESSING</p>
                        </div>
                        <div class="absolute top-6 right-6 glass px-4 py-2 rounded-full border border-white/10">
                            <span class="text-[10px] font-bold tracking-widest uppercase text-blue-400">Synthesis</span>
                        </div>
                        <div id="genTimeLabel" class="absolute bottom-6 right-6 text-[10px] font-mono text-zinc-500"></div>
                    </div>
                </div>
            </div>
        </section>

        <section id="view-gallery" class="hidden h-full p-6 overflow-y-auto">
            <div class="flex justify-between items-center mb-8">
                <h2 class="text-2xl font-['Space_Grotesk'] font-bold tracking-tight">The Vault</h2>
                <button onclick="clearVault()" class="text-[10px] text-red-400 font-bold border border-red-500/20 px-3 py-1 rounded-lg hover:bg-red-500/10 transition-colors">CLEAR ALL</button>
            </div>
            <div id="galleryGrid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-4">
                </div>
        </section>

        <section id="view-settings" class="hidden h-full p-6 overflow-y-auto max-w-2xl mx-auto">
            <div class="flex justify-between items-end mb-10">
                <h2 class="text-2xl font-['Space_Grotesk'] font-bold tracking-tight">Configuration</h2>
                <div class="flex gap-2">
                    <button onclick="exportSettings()" class="text-[10px] font-bold text-zinc-400 border border-white/10 px-3 py-1 rounded-lg">EXPORT</button>
                    <label class="text-[10px] font-bold text-zinc-400 border border-white/10 px-3 py-1 rounded-lg cursor-pointer">
                        IMPORT <input type="file" hidden onchange="importSettings(event)">
                    </label>
                </div>
            </div>

            <div class="space-y-8">
                <div class="space-y-4">
                    <label class="text-[10px] font-bold text-zinc-500 uppercase tracking-widest">NanoGPT API Access</label>
                    <input type="password" id="apiKey" class="w-full p-4 rounded-2xl text-sm" placeholder="Paste your API key here...">
                    <button onclick="saveApiKey()" class="w-full py-3 bg-white text-black rounded-xl font-bold text-xs">REFRESH MODELS</button>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="space-y-2">
                        <label class="text-[10px] font-bold text-zinc-500 uppercase">Vision (Analyze)</label>
                        <select id="modelVision" class="w-full p-3 rounded-xl text-xs"></select>
                    </div>
                    <div class="space-y-2">
                        <label class="text-[10px] font-bold text-zinc-500 uppercase">Text (Enhance)</label>
                        <select id="modelText" class="w-full p-3 rounded-xl text-xs"></select>
                    </div>
                    <div class="space-y-2">
                        <label class="text-[10px] font-bold text-zinc-500 uppercase">Image (Generate)</label>
                        <select id="modelImage" class="w-full p-3 rounded-xl text-xs"></select>
                    </div>
                    <div class="space-y-2">
                        <label class="text-[10px] font-bold text-zinc-500 uppercase">Resolution</label>
                        <select id="resolution" class="w-full p-3 rounded-xl text-xs">
                            <option value="1024x1024">Square (1:1)</option>
                            <option value="1024x1792">Portrait (9:16)</option>
                            <option value="1792x1024">Landscape (16:9)</option>
                        </select>
                    </div>
                </div>

                <div class="space-y-2">
                    <label class="text-[10px] font-bold text-zinc-500 uppercase">System Analysis Prompt</label>
                    <textarea id="systemPrompt" class="w-full h-32 p-4 rounded-2xl text-xs leading-relaxed"></textarea>
                </div>
            </div>
        </section>
    </main>

    <nav class="glass fixed bottom-0 w-full h-20 border-t border-white/5 flex justify-around items-center px-4 safe-pb z-50">
        <button onclick="switchView('gallery')" class="nav-btn flex flex-col items-center gap-1 text-zinc-500">
            <span class="material-symbols-outlined">photo_library</span>
            <span class="text-[9px] font-bold uppercase tracking-widest">Vault</span>
        </button>
        <button onclick="switchView('editor')" class="nav-btn flex flex-col items-center gap-1 text-blue-400">
            <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">auto_fix_high</span>
            <span class="text-[9px] font-bold uppercase tracking-widest">Editor</span>
        </button>
        <button onclick="switchView('settings')" class="nav-btn flex flex-col items-center gap-1 text-zinc-500">
            <span class="material-symbols-outlined">settings_input_component</span>
            <span class="text-[9px] font-bold uppercase tracking-widest">Config</span>
        </button>
    </nav>

    <div id="enhancerModal" class="fixed inset-0 z-[100] glass hidden items-center justify-center p-6">
        <div class="bg-[#1b1b1d] w-full max-w-lg rounded-3xl p-8 border border-white/10 shadow-2xl">
            <h3 class="text-xl font-bold mb-6">Edit Enhancement</h3>
            <div class="space-y-4">
                <input type="text" id="editEnhName" placeholder="Name (e.g., Cinematic Lighting)" class="w-full p-4 rounded-2xl">
                <textarea id="editEnhPrompt" placeholder="Prompt instructions..." class="w-full h-40 p-4 rounded-2xl text-xs"></textarea>
                <div class="flex items-center gap-3">
                    <input type="checkbox" id="editEnhAuto" class="rounded bg-white/5 border-white/10 text-blue-500 w-5 h-5">
                    <label class="text-xs text-zinc-400">Auto-Apply after Analysis</label>
                </div>
            </div>
            <div class="flex gap-3 mt-8">
                <button onclick="closeEnhancerModal()" class="flex-1 py-4 bg-zinc-800 rounded-2xl text-xs font-bold uppercase">Cancel</button>
                <button onclick="saveEnhancement()" class="flex-1 py-4 bg-blue-600 rounded-2xl text-xs font-bold uppercase">Save Logic</button>
            </div>
        </div>
    </div>

    <div id="debugDrawer" class="fixed bottom-20 left-0 w-full glass h-64 border-t border-white/10 z-[40] hidden flex flex-col">
        <div class="flex justify-between items-center px-4 py-2 bg-black/40 border-b border-white/5">
            <span class="text-[9px] font-bold uppercase tracking-widest text-zinc-500">System Logs</span>
            <button onclick="toggleDebug()" class="material-symbols-outlined text-sm">close</button>
        </div>
        <div id="debugContent" class="flex-1 overflow-auto p-4 debug-scroll whitespace-pre-wrap text-zinc-300">
            </div>
    </div>

    <div id="lightbox" class="fixed inset-0 z-[150] bg-black/95 hidden items-center justify-center p-4 backdrop-blur-sm" onclick="if(event.target === this) closeLightbox()">
        <img id="lightboxImg" class="max-w-full max-h-full object-contain shadow-2xl rounded-lg">
        <button onclick="closeLightbox()" class="absolute top-6 right-6 w-10 h-10 rounded-full bg-white/10 flex items-center justify-center text-white hover:bg-white/20 transition-all"><span class="material-symbols-outlined">close</span></button>
    </div>

<script>
    // --- STATE & PERSISTENCE ---
    let config = {
        apiKey: localStorage.getItem('atelier_key') || '',
        visionModel: localStorage.getItem('atelier_visionModel') || 'gpt-4o',
        textModel: localStorage.getItem('atelier_textModel') || 'gpt-4o-mini',
        imageModel: localStorage.getItem('atelier_imageModel') || 'dall-e-3',
        resolution: localStorage.getItem('atelier_resolution') || '1024x1024',
        systemPrompt: localStorage.getItem('atelier_systemPrompt') || "Describe this image in extreme, forensic detail. Focus on lighting, materials, and composition for image-to-image synthesis.",
        enhancements: JSON.parse(localStorage.getItem('atelier_enhancements')) || [
            { id: 1, name: 'Natural Skin', prompt: 'Enhance skin texture, pores, and natural lighting. High fidelity.', auto: true }
        ]
    };

    function saveSetting(key, value) {
        config[key] = value;
        localStorage.setItem(`atelier_${key}`, value);
    }

    // let currentImage = null;
    let imageQueue = []; // Now stores an array of base64 strings
    let db;
    let availableImageModels = [];

    // --- INITIALIZATION ---
    async function init() {
        // Init IndexedDB for Gallery
        const request = indexedDB.open("AtelierVault", 1);
        request.onupgradeneeded = e => e.target.result.createObjectStore("gallery", { keyPath: "id", autoIncrement: true });
        request.onsuccess = e => { db = e.target.result; renderGallery(); };

        // Load Config into UI
        document.getElementById('apiKey').value = config.apiKey;
        document.getElementById('systemPrompt').value = config.systemPrompt;
        document.getElementById('resolution').value = config.resolution;

        // Add listeners
        document.getElementById('systemPrompt').addEventListener('input', (e) => saveSetting('systemPrompt', e.target.value));
        document.getElementById('resolution').addEventListener('change', (e) => saveSetting('resolution', e.target.value));
        
        renderEnhancements();
        if(config.apiKey) fetchModels();
    }

    // --- NAVIGATION ---
    function switchView(view) {
        ['editor', 'gallery', 'settings'].forEach(v => {
            document.getElementById(`view-${v}`).classList.add('hidden');
        });
        document.getElementById(`view-${view}`).classList.remove('hidden');
        
        document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.replace('text-blue-400', 'text-zinc-500'));
        event.currentTarget.classList.replace('text-zinc-500', 'text-blue-400');
    }

    function switchMobileTab(tab) {
        const inputs = document.getElementById('editor-inputs');
        const preview = document.getElementById('editor-preview');
        const tInput = document.getElementById('tab-inputs');
        const tPreview = document.getElementById('tab-preview');

        if (tab === 'inputs') {
            inputs.classList.remove('hidden');
            preview.classList.add('hidden');
            tInput.classList.replace('text-zinc-500', 'text-blue-400');
            tInput.classList.replace('border-transparent', 'border-blue-500');
            tPreview.classList.replace('text-blue-400', 'text-zinc-500');
            tPreview.classList.replace('border-blue-500', 'border-transparent');
        } else {
            inputs.classList.add('hidden');
            preview.classList.remove('hidden');
            tPreview.classList.replace('text-zinc-500', 'text-blue-400');
            tPreview.classList.replace('border-transparent', 'border-blue-500');
            tInput.classList.replace('text-blue-400', 'text-zinc-500');
            tInput.classList.replace('border-blue-500', 'border-transparent');
        }
    }

    // --- ENHANCEMENT LOGIC ---
    function renderEnhancements() {
        const container = document.getElementById('enhancerList');
        container.innerHTML = config.enhancements.map(enh => `
            <div class="bg-zinc-800/30 border border-white/5 rounded-2xl p-3 flex items-center justify-between group">
                <div class="flex items-center gap-3">
                    <input type="checkbox" ${enh.auto ? 'checked' : ''} onchange="toggleAuto(${enh.id})" 
class="rounded bg-white/5 border-white/10 text-blue-500 w-5 h-5 focus:ring-blue-500 transition-colors">
                    <div>
                        <p class="text-[11px] font-bold text-white">${enh.name}</p>
                        <p class="text-[8px] text-zinc-500 uppercase tracking-tighter">Auto-Run: ${enh.auto ? 'ON' : 'OFF'}</p>
                    </div>
                </div>
                <div class="flex gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
                    <button onclick="runEnhanceSingle(${enh.id})" class="text-blue-400"><span class="material-symbols-outlined text-sm">play_arrow</span></button>
                    <button onclick="openEnhancerModal(${enh.id})" class="text-zinc-400 hover:text-white"><span class="material-symbols-outlined text-sm">edit</span></button>
                    <button onclick="deleteEnh(${enh.id})" class="text-zinc-500 hover:text-red-400"><span class="material-symbols-outlined text-sm">delete</span></button>
                </div>
            </div>
        `).join('');
        localStorage.setItem('atelier_enhancements', JSON.stringify(config.enhancements));
    }

    function toggleAuto(id) {
        const target = config.enhancements.find(e => e.id === id);
        target.auto = !target.auto;
        renderEnhancements();
    }

    let editingEnhId = null;
    function openEnhancerModal(id = null) {
        editingEnhId = id;
        if (id) {
            const enh = config.enhancements.find(e => e.id === id);
            document.getElementById('editEnhName').value = enh.name;
            document.getElementById('editEnhPrompt').value = enh.prompt;
            document.getElementById('editEnhAuto').checked = enh.auto;
        } else {
            document.getElementById('editEnhName').value = '';
            document.getElementById('editEnhPrompt').value = '';
            document.getElementById('editEnhAuto').checked = false;
        }
        document.getElementById('enhancerModal').classList.replace('hidden', 'flex');
    }

    function closeEnhancerModal() { document.getElementById('enhancerModal').classList.replace('flex', 'hidden'); }

    function saveEnhancement() {
        const name = document.getElementById('editEnhName').value;
        const prompt = document.getElementById('editEnhPrompt').value;
        const auto = document.getElementById('editEnhAuto').checked;
        
        if (editingEnhId) {
            const idx = config.enhancements.findIndex(e => e.id === editingEnhId);
            if (idx > -1) config.enhancements[idx] = { ...config.enhancements[idx], name, prompt, auto };
        } else {
            config.enhancements.push({ id: Date.now(), name, prompt, auto });
        }
        renderEnhancements();
        closeEnhancerModal();
    }
    
    function deleteEnh(id) {
        config.enhancements = config.enhancements.filter(e => e.id !== id);
        renderEnhancements();
    }

    // --- CORE API WORKFLOW ---
async function runAnalyze() {
    if (imageQueue.length === 0) return alert("Upload images first.");
    
    const btn = document.getElementById('mainActionBtn');
    const originalText = btn.innerHTML;
    btn.disabled = true;
    setLoading(true, "STARTING BATCH...");

    for (let i = 0; i < imageQueue.length; i++) {
        const currentImg = imageQueue[i];
        const progressPrefix = `(${i + 1}/${imageQueue.length})`;
        
        // Update Button and Loader for Analysis
        btn.innerHTML = `<span class="animate-spin material-symbols-outlined text-sm">progress_activity</span> ANALYZING ${progressPrefix}`;
        setLoading(true, `ANALYZING ${progressPrefix}`);
        document.getElementById('view-original').src = currentImg;

        try {
            const payload = {
                model: document.getElementById('modelVision').value,
                messages: [
                    { role: 'system', content: config.systemPrompt },
                    { role: 'user', content: [{ type: 'text', text: "Analyze this image." }, { type: 'image_url', image_url: { url: currentImg } }] }
                ]
            };

            const resp = await callNano('/v1/chat/completions', payload);
            const text = resp.choices[0].message.content;
            
            document.getElementById('basePrompt').value = text;
            document.getElementById('finalPrompt').value = text;

            // Apply Enhancements
            const activeEnhancements = config.enhancements.filter(e => e.auto);
            for (let j = 0; j < activeEnhancements.length; j++) {
                const enh = activeEnhancements[j];
                btn.innerHTML = `<span class="animate-spin material-symbols-outlined text-sm">auto_fix_high</span> ENHANCING ${progressPrefix}...`;
                await runEnhanceSingle(enh.id);
            }

            // Auto-Generate if checked
            if (document.getElementById('autoGenerate').checked) {
                btn.innerHTML = `<span class="animate-spin material-symbols-outlined text-sm">auto_awesome</span> GENERATING ${progressPrefix}...`;
                await runGenerateSingle(currentImg, i);
            }
        } catch (e) {
            logDebug(`Error on image ${i+1}: ${e.message}`);
        }
    }

    btn.disabled = false;
    setLoading(false);
    btn.innerHTML = `<span class="material-symbols-outlined">analytics</span> BATCH COMPLETE`;
    }
    
// Helper for single generation within the batch loop
async function runGenerateSingle(imgSrc, index) {
    setLoading(true, `GENERATING (${index + 1}/${imageQueue.length})`);
    const startTime = Date.now();
    const sizeStr = document.getElementById('resolution').value;
    const [w, h] = sizeStr.split('x').map(Number);

    const payload = {
        model: document.getElementById('modelImage').value,
        prompt: document.getElementById('finalPrompt').value,
        size: sizeStr,
        width: w,
        height: h,
        imageDataUrls: [imgSrc],
        response_format: "b64_json",
        nImages: 1, 
        showExplicitContent: true,
        resolutionExplicit: true,
    };

    try {
        const resp = await callNano('/v1/images/generations', payload);
        const b64 = resp.data[0].b64_json;
        const fullSrc = "data:image/png;base64," + b64;
        
        document.getElementById('view-result').src = fullSrc;
        const duration = ((Date.now() - startTime) / 1000).toFixed(1);
        saveToVault(fullSrc, duration); // Save result to IndexedDB
    } catch (e) {
        logDebug(`Generation failed for image ${index + 1}`);
    }
}

async function runGenerate() {
    if (imageQueue.length === 0) return alert("Upload images first.");
    const btn = document.getElementById('genBtn');
    btn.disabled = true;
    
    for (let i = 0; i < imageQueue.length; i++) {
        await runGenerateSingle(imageQueue[i], i);
    }
    
    btn.disabled = false;
    setLoading(false);
}
    
    async function runEnhanceSingle(id) {
        const enh = config.enhancements.find(e => e.id === id);
        setLoading(true, `ENHANCING: ${enh.name}`);
        
        const payload = {
            model: document.getElementById('modelText').value,
            messages: [
                { role: 'system', content: "You are an expert prompt engineer. Update the image description based on the following directive. Output only the final updated description.\n\nDirective: " + enh.prompt },
                { role: 'user', content: document.getElementById('finalPrompt').value }
            ]
        };

        try {
            const resp = await callNano('/v1/chat/completions', payload);
            if (resp.error) throw new Error(resp.error.message || "API Error");
            document.getElementById('finalPrompt').value = resp.choices[0].message.content;
        } catch (e) { 
            logDebug("Error during enhancement: " + e.message);
            alert(`Enhancement '${enh.name}' failed: ${e.message}`);
        }
        setLoading(false);
    }

    // --- UTILS ---
    async function callNano(endpoint, body) {
        logDebug(`POST ${endpoint}\nPayload: ${JSON.stringify(body).replace(/data:image\/[^;]+;base64,[^"]+/g, '<BASE64_IMG>')}`);
        const resp = await fetch(`https://nano-gpt.com/api${endpoint}`, {
            method: 'POST',
            headers: { 'Authorization': `Bearer ${config.apiKey}`, 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
        });
        const data = await resp.json();
        const logData = { ...data };
        if (logData.data && Array.isArray(logData.data)) {
            logData.data = logData.data.map(d => ({ ...d, b64_json: d.b64_json ? '<BASE64_HIDDEN>' : undefined }));
        }
        logDebug(`RESPONSE: ${JSON.stringify(logData).substring(0, 500)}...`);
        return data;
    }

async function handleFile(e) {
    const files = Array.from(e.target.files);
    if (files.length === 0) return;

    imageQueue = []; // Clear existing queue
    const previewImg = document.getElementById('sourcePreview');
    const dropZoneText = document.querySelector('#dropZone p');

    for (const file of files) {
        const base64 = await readFileAsBase64(file);
        imageQueue.push(base64);
    }

    // Show the first image as a preview and update the label count
    previewImg.src = imageQueue[0];
    previewImg.classList.remove('hidden');
    document.getElementById('view-original').src = imageQueue[0];
    dropZoneText.innerText = `${imageQueue.length} IMAGES LOADED`;
    logDebug(`Batch loaded: ${imageQueue.length} images.`);
}

// Helper to read files as base64 for the API
function readFileAsBase64(file) {
    return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => resolve(e.target.result);
        reader.readAsDataURL(file);
    });
}

    function setLoading(show, text = "") {
        document.getElementById('loader').classList.toggle('hidden', !show);
        document.getElementById('loaderStatus').innerText = text;
    }

    function saveToVault(src, time) {
        const tx = db.transaction("gallery", "readwrite");
        tx.objectStore("gallery").add({ src, time, date: new Date() });
        renderGallery();
    }

    function renderGallery() {
        const container = document.getElementById('galleryGrid');
        container.innerHTML = "";
        const store = db.transaction("gallery").objectStore("gallery");
        store.openCursor(null, "prev").onsuccess = e => {
            const cursor = e.target.result;
            if (cursor) {
                const item = cursor.value;
                const div = document.createElement('div');
                div.className = "aspect-square rounded-2xl overflow-hidden bg-zinc-900 border border-white/5 relative group";
                div.innerHTML = `
                    <img src="${item.src}" class="w-full h-full object-cover cursor-pointer" onclick="openLightbox('${item.src}')">
                    <div class="absolute bottom-2 right-2 bg-black/60 backdrop-blur px-2 py-1 rounded-lg pointer-events-none">
                        <span class="text-[8px] font-bold text-zinc-300 font-mono">${item.time}s</span>
                    </div>
                    <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center gap-3 pointer-events-none">
                        <button onclick="downloadImg('${item.src}')" class="pointer-events-auto w-10 h-10 rounded-full bg-white/10 backdrop-blur hover:bg-white/20 flex items-center justify-center text-white transition-all shadow-lg"><span class="material-symbols-outlined text-lg">download</span></button>
                        <button onclick="deleteItem(${cursor.key})" class="pointer-events-auto w-10 h-10 rounded-full bg-red-500/20 backdrop-blur hover:bg-red-500 hover:text-white flex items-center justify-center text-red-400 transition-all shadow-lg"><span class="material-symbols-outlined text-lg">delete</span></button>
                    </div>
                `;
                container.appendChild(div);
                cursor.continue();
            }
        };
    }

    function deleteItem(key) {
        if(!confirm("Delete this image?")) return;
        const tx = db.transaction("gallery", "readwrite");
        tx.objectStore("gallery").delete(key);
        tx.oncomplete = () => renderGallery();
    }

    function clearVault() {
        if(!confirm("Delete ALL images? This cannot be undone.")) return;
        const tx = db.transaction("gallery", "readwrite");
        tx.objectStore("gallery").clear();
        tx.oncomplete = () => renderGallery();
    }

    function openLightbox(src) {
        document.getElementById('lightboxImg').src = src;
        document.getElementById('lightbox').classList.replace('hidden', 'flex');
    }

    function closeLightbox() {
        document.getElementById('lightbox').classList.replace('flex', 'hidden');
    }

    function downloadImg(src) {
        const a = document.createElement('a'); a.href = src; a.download = `atelier_${Date.now()}.png`; a.click();
    }

    function logDebug(msg) {
        const content = document.getElementById('debugContent');
        content.innerText += `\n[${new Date().toLocaleTimeString()}] ${msg}\n-------------------`;
        content.scrollTop = content.scrollHeight;
    }

    function toggleDebug() { document.getElementById('debugDrawer').classList.toggle('hidden'); }

    // --- COMPARE UTILS ---
function toggleCompare() {
    const view = document.getElementById('compareView');
    const split = document.getElementById('splitContainer');
    const btn = document.getElementById('cmpBtnText');
    
    // Get the current source image being viewed
    const activeSource = document.getElementById('view-original').src;

    if (view.classList.contains('hidden')) {
        // Check if a source image actually exists
        if (!activeSource || activeSource.includes('window.location.href')) {
            return alert("No image to compare");
        }
        
        document.getElementById('cmp-before').src = activeSource;
        document.getElementById('cmp-after').src = document.getElementById('view-result').src || activeSource;
        
        view.classList.remove('hidden');
        split.classList.add('opacity-0');
        btn.innerText = "EXIT COMPARE";
        document.querySelector('#compareView input').value = 50;
        updateCompare(50);
    } else {
        view.classList.add('hidden');
        split.classList.remove('opacity-0');
        btn.innerText = "COMPARE";
    }
}

    function updateCompare(val) {
        document.getElementById('cmp-line').style.left = val + '%';
        document.getElementById('cmp-after').style.clipPath = `inset(0 0 0 ${val}%)`;
    }

    // --- DIFF UTILS ---
    function toggleDiff() {
        const diffView = document.getElementById('diffOutput');
        const textArea = document.getElementById('finalPrompt');
        const btn = document.getElementById('diffBtn');
        
        if (diffView.classList.contains('hidden')) {
            diffView.innerHTML = computeDiffHtml(document.getElementById('basePrompt').value, textArea.value);
            diffView.classList.remove('hidden');
            textArea.classList.add('opacity-0');
            btn.innerText = "EDIT PROMPT";
            btn.classList.add('text-blue-400');
        } else {
            diffView.classList.add('hidden');
            textArea.classList.remove('opacity-0');
            btn.innerText = "SHOW DIFF";
            btn.classList.remove('text-blue-400');
        }
    }

    function computeDiffHtml(oldText, newText) {
        if (!oldText) return newText;
        const os = oldText.split(/\s+/);
        const ns = newText.split(/\s+/);
        let html = '', o = 0, n = 0;
        while (n < ns.length) {
            if (o < os.length && ns[n] === os[o]) {
                html += `<span class="text-zinc-500">${ns[n]} </span>`; o++; n++;
            } else {
                let match = -1;
                for (let k = 1; k <= 15; k++) if (o + k < os.length && os[o + k] === ns[n]) { match = o + k; break; }
                if (match !== -1) {
                    for (let k = o; k < match; k++) html += `<span class="text-red-500/50 line-through text-[10px] mr-1">${os[k]}</span>`;
                    o = match;
                } else {
                    html += `<span class="text-green-400 font-bold bg-green-500/10 rounded px-1">${ns[n]}</span> `; n++;
                }
            }
        }
        return html;
    }

    // --- CONFIG MGMT ---
    async function fetchModels() {
        try {
            const resp = await fetch('https://nano-gpt.com/api/v1/models', { headers: { 'Authorization': `Bearer ${config.apiKey}` }});
            const { data } = await resp.json();
            data.sort((a,b) => a.id.localeCompare(b.id));
            
            const fill = (id, filter, key) => {
                const el = document.getElementById(id);
                el.innerHTML = data.filter(filter).map(m => `<option value="${m.id}">${m.id}</option>`).join('');
                if (config[key]) el.value = config[key];
                el.onchange = () => saveSetting(key, el.value);
            };
            fill('modelVision', m => m.id.includes('vision') || m.id.includes('gpt-4') || m.id.includes('claude-3') || m.id.includes('gemini'), 'visionModel');
            fill('modelText', m => true, 'textModel');
            
            const imgResp = await fetch('https://nano-gpt.com/api/v1/image-models?detailed=true', { headers: { 'Authorization': `Bearer ${config.apiKey}` }});
            const imgData = await imgResp.json();
            availableImageModels = imgData.data || [];
            availableImageModels.sort((a,b) => a.id.localeCompare(b.id));
            const imgEl = document.getElementById('modelImage');
            imgEl.innerHTML = availableImageModels.map(m => `<option value="${m.id}">${m.id}</option>`).join('');
            if (config.imageModel) imgEl.value = config.imageModel;
            
            updateResolutions();
            imgEl.onchange = () => {
                saveSetting('imageModel', imgEl.value);
                updateResolutions();
            };
        } catch (e) { logDebug("Model load failed: " + e.message); }
    }

    function updateResolutions() {
        const modelId = document.getElementById('modelImage').value;
        const resSelect = document.getElementById('resolution');
        const model = availableImageModels.find(m => m.id === modelId);
        
        const currentRes = resSelect.value || config.resolution;
        let html = '';

        if (model && model.supported_parameters && model.supported_parameters.resolutions) {
            html = model.supported_parameters.resolutions.map(r => {
                let label = r;
                const [w, h] = r.split('x').map(Number);
                if (w === h) label += ' (Square)';
                else if (w < h) label += ' (Portrait)';
                else if (w > h) label += ' (Landscape)';
                return `<option value="${r}">${label}</option>`;
            }).join('');
        } else {
            html = `
                <option value="1024x1024">1024x1024 (Square)</option>
                <option value="1024x1792">1024x1792 (Portrait)</option>
                <option value="1792x1024">1792x1024 (Landscape)</option>
            `;
        }
        
        resSelect.innerHTML = html;
        
        if (resSelect.querySelector(`option[value="${currentRes}"]`)) {
            resSelect.value = currentRes;
        } else if (resSelect.options.length > 0) {
            resSelect.value = resSelect.options[0].value;
            saveSetting('resolution', resSelect.value);
        }
    }

    function saveApiKey() {
        config.apiKey = document.getElementById('apiKey').value;
        localStorage.setItem('atelier_key', config.apiKey);
        fetchModels();
    }

    function exportSettings() {
        const blob = new Blob([JSON.stringify(config, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a'); a.href = url; a.download = 'atelier_settings.json'; a.click();
    }

    function importSettings(e) {
        const reader = new FileReader();
        reader.onload = ev => {
            const newConfig = JSON.parse(ev.target.result);
            Object.keys(newConfig).forEach(key => {
                if (key === 'enhancements') {
                    localStorage.setItem('atelier_enhancements', JSON.stringify(newConfig[key]));
                } else if (key === 'apiKey') {
                    localStorage.setItem('atelier_key', newConfig[key]);
                } else {
                    localStorage.setItem(`atelier_${key}`, newConfig[key]);
                }
            });
            location.reload();
        };
        reader.readAsText(e.target.files[0]);
    }

    init();
</script>
