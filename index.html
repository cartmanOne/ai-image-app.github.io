<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>AI Image Flow (NanoGPT)</title>
    <style>
        :root {
            --bg-color: #000000; --card-bg: #1c1c1e; --text-color: #ffffff;
            --accent: #0a84ff; --border: #2c2c2e; --danger: #ff453a;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color); color: var(--text-color);
            margin: 0; padding: 20px; overscroll-behavior: none;
        }
        .container { max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
        h1 { font-size: 22px; text-align: center; margin-bottom: 10px; }
        
        /* Settings Button */
        .settings-btn {
            background: var(--card-bg); border: 1px solid var(--border); color: var(--accent);
            padding: 8px 16px; border-radius: 20px; font-size: 14px; align-self: center; cursor: pointer;
        }

        /* Modal for Settings */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 100; justify-content: center; align-items: center;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: var(--card-bg); padding: 20px; border-radius: 12px; width: 90%;
            max-width: 400px; display: flex; flex-direction: column; gap: 15px; max-height: 90vh;
            overflow-y: auto;
        }
        input, select, textarea {
            width: 100%; background: #2c2c2e; border: 1px solid var(--border);
            color: white; padding: 10px; border-radius: 8px; box-sizing: border-box;
            font-family: inherit; font-size: 14px;
        }
        textarea { height: 100px; resize: none; }
        .hint { font-size: 11px; color: #888; margin-top: -5px; }
        
        .btn {
            background: var(--accent); color: white; border: none; padding: 12px;
            border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; width: 100%;
        }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-secondary { background: var(--card-bg); border: 1px solid var(--border); }

        /* Workspace */
        .upload-box {
            border: 2px dashed var(--border); border-radius: 12px; padding: 30px;
            text-align: center; cursor: pointer; transition: background 0.3s;
        }
        .upload-box:active { background: #333; }
        input[type="file"] { display: none; }
        
        .workspace { display: none; flex-direction: column; gap: 15px; }
        .image-preview { width: 100%; border-radius: 12px; background: #000; }
        
        .status { text-align: center; font-size: 14px; color: #888; min-height: 20px; }
        
        .gallery-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px;
        }
        .gallery-item {
            width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 8px; cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>AI Image Flow</h1>
    <button class="settings-btn" onclick="openSettings()">⚙️ API & Settings</button>

    <!-- Upload Area -->
    <div class="upload-box" onclick="document.getElementById('fileInput').click()">
        <p>Tap to select Image</p>
        <input type="file" id="fileInput" accept="image/*" onchange="handleImageUpload(event)">
    </div>

    <!-- Workspace -->
    <div class="workspace" id="workspace">
        <img id="originalPreview" class="image-preview" src="" alt="Original">
        
        <div class="status" id="statusText">Ready</div>

        <!-- Model Config -->
        <div style="display:flex; gap:10px;">
            <div style="flex:1">
                <label style="font-size: 11px; color:#888;">Vision Model</label>
                <input type="text" id="visionModel" value="gpt-4o">
                <div class="hint">For analysis</div>
            </div>
            <div style="flex:1">
                <label style="font-size: 11px; color:#888;">Image Model</label>
                <input type="text" id="genModel" value="seedream-v4.5">
                <div class="hint">For generation</div>
            </div>
        </div>

        <label style="font-size: 12px; color: #888;">AI Generated Prompt:</label>
        <textarea id="promptArea" placeholder="Prompt will appear here..."></textarea>

        <button class="btn" onclick="runFullFlow()" id="actionBtn">Analyze & Generate</button>
        
        <button class="btn btn-secondary" onclick="resetApp()">Start Over</button>
    </div>

    <!-- Gallery -->
    <div class="gallery-grid" id="gallery"></div>
</div>

<!-- Settings Modal -->
<div class="modal" id="settingsModal">
    <div class="modal-content">
        <h3 style="margin:0;">Configuration</h3>
        
        <div>
            <label style="font-size:12px; color:#888;">NanoGPT API Key</label>
            <input type="password" id="apiKeyInput" placeholder="sk-...">
            <div class="hint">Stored in browser Local Storage only.</div>
        </div>

        <div>
            <label style="font-size:12px; color:#888;">System Prompt (Vision)</label>
            <textarea id="systemPrompt">Analyze the image. Generate a highly detailed prompt for an image generation AI. Describe the subject, setting, lighting, and mood in explicit detail.</textarea>
        </div>

        <div>
            <label style="font-size:12px; color:#888;">Default Enhancements</label>
            <textarea id="enhancementPrompt">cinematic lighting, 8k resolution, highly detailed, masterpiece</textarea>
            <div class="hint">Appended to every generated prompt.</div>
        </div>

        <div style="display:flex; gap:10px; margin-top:10px;">
            <button class="btn" style="background:var(--accent);" onclick="saveSettings()">Save</button>
            <button class="btn btn-secondary" onclick="closeSettings()">Cancel</button>
        </div>
    </div>
</div>

<script>
    // --- STATE ---
    let API_KEY = localStorage.getItem('nanogpt_key') || '';
    const BASE_URL = 'https://nano-gpt.com/api';
    
    // We keep the full data URL (data:image/png;base64,....) for imageDataUrls
    let currentImageDataUrl = null; 

    // --- INIT ---
    document.addEventListener('DOMContentLoaded', () => {
        if(localStorage.getItem('system_prompt')) document.getElementById('systemPrompt').value = localStorage.getItem('system_prompt');
        if(localStorage.getItem('enhancement_prompt')) document.getElementById('enhancementPrompt').value = localStorage.getItem('enhancement_prompt');
        
        if (!API_KEY) {
            openSettings();
            document.getElementById('statusText').innerText = "Enter API Key in Settings";
        }
    });

    // --- SETTINGS ---
    function openSettings() {
        document.getElementById('settingsModal').classList.add('active');
        document.getElementById('apiKeyInput').value = API_KEY;
    }
    function closeSettings() {
        document.getElementById('settingsModal').classList.remove('active');
    }
    function saveSettings() {
        API_KEY = document.getElementById('apiKeyInput').value;
        localStorage.setItem('nanogpt_key', API_KEY);
        localStorage.setItem('system_prompt', document.getElementById('systemPrompt').value);
        localStorage.setItem('enhancement_prompt', document.getElementById('enhancementPrompt').value);
        closeSettings();
        alert("Settings Saved");
    }

    // --- IMAGE HANDLING ---
    function handleImageUpload(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            const workspace = document.getElementById('workspace');
            workspace.style.display = 'flex';
            document.querySelector('.upload-box').style.display = 'none';

            // Preview
            document.getElementById('originalPreview').src = e.target.result;

            // Store full Data URL for Image-to-Image API
            currentImageDataUrl = e.target.result; 
        };
        reader.readAsDataURL(file);
    }

    // --- WORKFLOW ---
    async function runFullFlow() {
        if(!API_KEY) {
            alert("Please set your API Key in settings.");
            openSettings();
            return;
        }

        const btn = document.getElementById('actionBtn');
        const status = document.getElementById('statusText');
        const promptArea = document.getElementById('promptArea');
        
        const visionModel = document.getElementById('visionModel').value || 'gpt-4o';
        const genModel = document.getElementById('genModel').value || 'seedream-v4.5';
        const sysPrompt = document.getElementById('systemPrompt').value;
        const enhancement = document.getElementById('enhancementPrompt').value;

        btn.disabled = true;

        try {
            // --- PHASE 1: VISION (Text Generation) ---
            status.innerText = "1/2: Analyzing with " + visionModel + "...";
            
            // Extract base64 data for vision API (some require just base64, some URL)
            // NanoGPT wrapper usually handles data URLs in content.
            const visionPayload = {
                model: visionModel,
                messages: [
                    { role: 'system', content: sysPrompt },
                    { 
                        role: 'user', 
                        content: [
                            { type: 'text', text: "Process this image." },
                            { type: 'image_url', image_url: { url: currentImageDataUrl } }
                        ]
                    }
                ]
            };

            const visionResp = await fetch(`${BASE_URL}/v1/chat/completions`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${API_KEY}` },
                body: JSON.stringify(visionPayload)
            });

            const visionData = await visionResp.json();
            if (!visionResp.ok) throw new Error(visionData.error?.message || 'Vision API Error');
            
            let generatedPrompt = visionData.choices[0].message.content;
            
            // Append Enhancements
            if(enhancement) generatedPrompt += ", " + enhancement;
            
            promptArea.value = generatedPrompt;
            status.innerText = "2/2: Generating with " + genModel + "...";

            // --- PHASE 2: IMAGE GENERATION (Image-to-Image) ---
            const imagePayload = {
                model: genModel,
                prompt: generatedPrompt,
                nImages: 1,
                resolution: "1920x1920", // Or desired resolution
                showExplicitContent: true, // Handle NSFW
                imageDataUrls: [ currentImageDataUrl ] // Pass the full data URL
            };

            const imageResp = await fetch(`${BASE_URL}/v1/images/generations`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${API_KEY}` },
                body: JSON.stringify(imagePayload)
            });

            const imageData = await imageResp.json();
            if (!imageResp.ok) throw new Error(imageData.error?.message || 'Image API Error');

            // Add to Gallery
            // Note: NanoGPT returns URL in data[0].url
            const imageUrl = imageData.data[0].url;
            addToGallery(imageUrl);
            status.innerText = "Done!";

        } catch (error) {
            console.error(error);
            status.innerText = "Error: " + error.message;
        } finally {
            btn.disabled = false;
        }
    }

    function addToGallery(url) {
        const gallery = document.getElementById('gallery');
        const img = document.createElement('img');
        img.src = url;
        img.className = 'gallery-item';
        img.onclick = () => window.open(url, '_blank');
        gallery.prepend(img);
    }

    function resetApp() {
        document.getElementById('workspace').style.display = 'none';
        document.querySelector('.upload-box').style.display = 'block';
        document.getElementById('fileInput').value = "";
        document.getElementById('promptArea').value = "";
        document.getElementById('statusText').innerText = "Ready";
        currentImageDataUrl = null;
    }
</script>
</body>
</html>
