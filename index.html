<script>
    document.addEventListener('DOMContentLoaded', function() {
        // Load prompts from localStorage
        document.getElementById('nudifyPrompt').value = localStorage.getItem('nudifyPrompt') || '';
        document.getElementById('posePrompt').value = localStorage.getItem('posePrompt') || '';
        document.getElementById('intimatePrompt').value = localStorage.getItem('intimatePrompt') || '';
        document.getElementById('fullshotPrompt').value = localStorage.getItem('fullshotPrompt') || '';
    });

    function savePrompts() {
        localStorage.setItem('nudifyPrompt', document.getElementById('nudifyPrompt').value);
        localStorage.setItem('posePrompt', document.getElementById('posePrompt').value);
        localStorage.setItem('intimatePrompt', document.getElementById('intimatePrompt').value);
        localStorage.setItem('fullshotPrompt', document.getElementById('fullshotPrompt').value);
    }

    // Call savePrompts function when closing settings
