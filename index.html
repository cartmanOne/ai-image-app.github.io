<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>AI Image Flow</title>
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #1c1c1e;
            --text-color: #ffffff;
            --accent: #0a84ff;
            --border: #2c2c2e;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            overscroll-behavior: none;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        h1 { font-size: 24px; text-align: center; margin-bottom: 0; }
        
        /* Upload Area */
        .upload-box {
            border: 2px dashed var(--border);
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: background 0.3s;
        }
        .upload-box:active { background: #333; }
        input[type="file"] { display: none; }

        /* Preview & Controls */
        .workspace { display: none; flex-direction: column; gap: 15px; }
        .image-preview {
            width: 100%;
            border-radius: 12px;
            background: #000;
        }
        textarea {
            width: 100%;
            height: 100px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text-color);
            border-radius: 8px;
            padding: 10px;
            box-sizing: border-box;
            font-family: inherit;
            resize: none;
        }
        .btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
        }
        .btn-secondary {
            background: var(--card-bg);
            border: 1px solid var(--border);
        }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* Gallery */
        .gallery-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 20px;
        }
        .gallery-item {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 8px;
            cursor: pointer;
        }
        .status {
            text-align: center;
            font-size: 14px;
            color: #888;
            min-height: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>AI Image Flow</h1>

    <!-- Step 1: Upload -->
    <div class="upload-box" onclick="document.getElementById('fileInput').click()">
        <p>Tap to select Image</p>
        <input type="file" id="fileInput" accept="image/*" onchange="handleImageUpload(event)">
    </div>

    <!-- Step 2: Workspace -->
    <div class="workspace" id="workspace">
        <img id="originalPreview" class="image-preview" src="" alt="Original">
        
        <div class="status" id="statusText">Ready</div>

        <label style="font-size: 12px; color: #888;">AI Generated Prompt:</label>
        <textarea id="promptArea" placeholder="Prompt will appear here..."></textarea>

        <button class="btn" onclick="runFullFlow()" id="actionBtn">Analyze & Generate</button>
        
        <button class="btn btn-secondary" onclick="resetApp()">Start Over</button>
    </div>

    <!-- Step 3: Gallery -->
    <div class="gallery-grid" id="gallery"></div>
</div>

<script>
    // --- CONFIGURATION ---
    // REPLACE THESE WITH YOUR ACTUAL API KEYS
    const GEMINI_API_KEY = "YOUR_GOOGLE_GEMINI_API_KEY";
    const STABILITY_API_KEY = "YOUR_STABILITY_AI_API_KEY"; // Or other img2img provider

    let currentImageBase64 = null;
    let currentImageMimeType = null;

    function handleImageUpload(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            // Show UI
            const workspace = document.getElementById('workspace');
            workspace.style.display = 'flex';
            document.querySelector('.upload-box').style.display = 'none';

            // Set Preview
            document.getElementById('originalPreview').src = e.target.result;

            // Store Base64 Data (Strip header for API calls)
            // Result format: "data:image/jpeg;base64,Lgkj..."
            const base64Full = e.target.result;
            currentImageBase64 = base64Full.split(',')[1]; // Get the "Lgkj..." part
            currentImageMimeType = file.type; // e.g. "image/jpeg"
        };
        reader.readAsDataURL(file);
    }

    async function runFullFlow() {
        const btn = document.getElementById('actionBtn');
        const status = document.getElementById('statusText');
        const promptArea = document.getElementById('promptArea');
        
        btn.disabled = true;

        try {
            // --- PHASE 1: Gemini Vision ---
            status.innerText = "Analyzing with Gemini...";
            
            // Define your predefined enhancement logic here
            const systemInstruction = "Describe this image in detail for an image generation AI. Focus on style, lighting, and composition. Do not include meta-commentary."; 
            
            const geminiPayload = {
                contents: [{
                    parts: [
                        { text: systemInstruction },
                        { inline_data: { mime_type: currentImageMimeType, data: currentImageBase64 } }
                    ]
                }]
            };

            const geminiResp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(geminiPayload)
            });

            const geminiData = await geminiResp.json();
            if (!geminiResp.ok) throw new Error(geminiData.error.message);

            const generatedPrompt = geminiData.candidates[0].content.parts[0].text;
            
            // Apply Enhancements
            const finalPrompt = generatedPrompt + ", cinematic lighting, 8k resolution, hyperrealistic";
            promptArea.value = finalPrompt;
            status.innerText = "Prompt generated. Starting Image Generation...";

            // --- PHASE 2: Image-to-Image (Stability AI Example) ---
            // Note: Gemini doesn't do img2img natively yet. Using Stability as placeholder.
            
            /* 
               FOR STABILITY AI:
               You send FormData with 'init_image' and 'text_prompts'.
            */
           
           // Placeholder for actually calling the API:
           await new Promise(r => setTimeout(r, 1000)); // Fake delay
           
           // SIMULATING A RESULT FOR NOW
           // In reality, you would send 'currentImageBase64' and 'finalPrompt' to Stability/DALL-E
           const fakeResultUrl = document.getElementById('originalPreview').src; // Just echoing image for demo
           
           addToGallery(fakeResultUrl);

            status.innerText = "Done!";

        } catch (error) {
            console.error(error);
            status.innerText = "Error: " + error.message;
        } finally {
            btn.disabled = false;
        }
    }

    function addToGallery(imageUrl) {
        const gallery = document.getElementById('gallery');
        const img = document.createElement('img');
        img.src = imageUrl;
        img.className = 'gallery-item';
        // Click to select logic could go here
        gallery.prepend(img);
    }

    function resetApp() {
        document.getElementById('workspace').style.display = 'none';
        document.querySelector('.upload-box').style.display = 'block';
        document.getElementById('fileInput').value = "";
        document.getElementById('promptArea').value = "";
        document.getElementById('statusText').innerText = "Ready";
    }
</script>

</body>
</html>
