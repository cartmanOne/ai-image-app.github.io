<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>AI Image Flow (NanoGPT)</title>
    <style>
        :root {
            --bg-color: #000000; --card-bg: #1c1c1e; --text-color: #ffffff;
            --accent: #0a84ff; --border: #2c2c2e; --danger: #ff453a;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color); color: var(--text-color);
            margin: 0; padding: 20px; overscroll-behavior: none;
        }
        .container { max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
        h1 { font-size: 22px; text-align: center; margin-bottom: 10px; }
        
        /* Components */
        .settings-btn {
            background: var(--card-bg); border: 1px solid var(--border); color: var(--accent);
            padding: 8px 16px; border-radius: 20px; font-size: 14px; align-self: center; cursor: pointer;
        }
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 100; justify-content: center; align-items: flex-start;
            overflow-y: auto; padding: 20px 0;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: var(--card-bg); padding: 20px; border-radius: 12px; width: 95%;
            max-width: 500px; display: flex; flex-direction: column; gap: 15px; margin: 20px 0;
        }
        select, input, textarea {
            width: 100%; background: #2c2c2e; border: 1px solid var(--border);
            color: white; padding: 10px; border-radius: 8px; box-sizing: border-box;
            font-family: inherit; font-size: 14px; -webkit-appearance: none;
        }
        select { background-image: url("data:image/svg+xml;utf8,<svg fill='white' viewBox='0 0 24 24' xmlns='http://www.w3.org/2000/svg'><path d='M7 10l5 5 5-5z'/></svg>"); background-repeat: no-repeat; background-position: right 10px center; background-size: 20px; }
        textarea { height: 80px; resize: none; }
        .hint { font-size: 11px; color: #888; margin-top: 2px; }
        .checkbox-group { display: flex; align-items: center; gap: 10px; font-size: 13px; }
        .btn {
            background: var(--accent); color: white; border: none; padding: 12px;
            border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; width: 100%;
        }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-secondary { background: var(--card-bg); border: 1px solid var(--border); }
        .btn-small { padding: 8px; font-size: 14px; margin-top: 5px; }

        /* Workspace */
        .upload-box {
            border: 2px dashed var(--border); border-radius: 12px; padding: 30px;
            text-align: center; cursor: pointer; transition: background 0.3s;
        }
        .upload-box:active { background: #333; }
        input[type="file"] { display: none; }
        
        .workspace { display: none; flex-direction: column; gap: 15px; }
        .image-preview { width: 100%; border-radius: 12px; background: #000; }
        .status { text-align: center; font-size: 14px; color: #888; min-height: 20px; }
        
        .gallery-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px;
        }
        .gallery-item {
            width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 8px; cursor: pointer;
        }
        
        /* Loading overlay for modal */
        .loading-row { background: #333; color: #888; padding: 10px; border-radius: 8px; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <h1>AI Image Flow</h1>
    <button class="settings-btn" onclick="openSettings()">⚙️ API & Models</button>

    <!-- Upload Area -->
    <div class="upload-box" onclick="document.getElementById('fileInput').click()">
        <p>Tap to select Image</p>
        <input type="file" id="fileInput" accept="image/*" onchange="handleImageUpload(event)">
    </div>

    <!-- Workspace -->
    <div class="workspace" id="workspace">
        <img id="originalPreview" class="image-preview" src="" alt="Original">
        
        <div class="status" id="statusText">Ready</div>

        <label style="font-size: 12px; color: #888;">Generated Prompt:</label>
        <textarea id="promptArea" placeholder="Analyzing..."></textarea>

        <button class="btn" onclick="runFullFlow()" id="actionBtn">Analyze & Generate</button>
        
        <button class="btn btn-secondary" onclick="resetApp()">Start Over</button>
    </div>

    <!-- Gallery -->
    <div class="gallery-grid" id="gallery"></div>
</div>

<!-- Settings Modal -->
<div class="modal" id="settingsModal">
    <div class="modal-content">
        <h3 style="margin:0 0 10px 0;">Configuration</h3>
        
        <!-- API Key -->
        <div>
            <label style="font-size:12px; color:#888;">NanoGPT API Key</label>
            <input type="password" id="apiKeyInput" placeholder="sk-...">
            <div class="hint">Stored locally in browser.</div>
        </div>

        <hr style="border-color:var(--border); margin:5px 0;">

        <!-- Vision Model -->
        <div>
            <label style="font-size:14px; font-weight:600;">1. Vision Model (Analyze)</label>
            <select id="visionModelSelect" onchange="saveSelectedModels()">
                <option value="">Loading...</option>
            </select>
            <div class="hint">Models with 'vision' capability.</div>
        </div>

        <!-- Prompt Enhancer Model -->
        <div>
            <label style="font-size:14px; font-weight:600;">2. Prompt Enhancer (Optional)</label>
            <select id="enhancerModelSelect" onchange="saveSelectedModels()">
                <option value="">-- Disabled --</option>
            </select>
            <div class="checkbox-group">
                <input type="checkbox" id="enhancerUncensored" onchange="fetchModels()">
                <label for="enhancerUncensored">Show Uncensored Models Only</label>
            </div>
        </div>

        <!-- Image Generation Model -->
        <div>
            <label style="font-size:14px; font-weight:600;">3. Image Model (Generate)</label>
            <select id="imageModelSelect" onchange="updateResolutions()">
                <option value="">Loading...</option>
            </select>
            <div class="checkbox-group">
                <input type="checkbox" id="imageNsfw" checked onchange="fetchModels()">
                <label for="imageNsfw">NSFW Enabled Only</label>
            </div>
        </div>

        <!-- Resolution -->
        <div>
            <label style="font-size:12px; color:#888;">Output Resolution</label>
            <select id="resolutionSelect">
                <option value="">Select Model First</option>
            </select>
        </div>

        <hr style="border-color:var(--border); margin:10px 0;">

        <!-- System Prompts -->
        <div>
            <label style="font-size:12px; color:#888;">Vision System Prompt</label>
            <textarea id="visionSystemPrompt">Describe this image in detail for image generation.</textarea>
        </div>
        <div>
            <label style="font-size:12px; color:#888;">Enhancer System Prompt</label>
            <textarea id="enhancerSystemPrompt">Rewrite the following prompt to be more detailed and artistic.</textarea>
        </div>

        <div style="display:flex; gap:10px; margin-top:10px;">
            <button class="btn" onclick="saveAndCloseSettings()">Save & Close</button>
        </div>
    </div>
</div>

<script>
    // --- STATE ---
    let API_KEY = localStorage.getItem('nanogpt_key') || '';
    const BASE_URL = 'https://nano-gpt.com/api';
    let currentImageDataUrl = null;
    let allTextModels = [];
    let allImageModels = [];

    // --- INIT ---
    document.addEventListener('DOMContentLoaded', () => {
        // Load saved keys/prompts
        if(localStorage.getItem('vision_system')) document.getElementById('visionSystemPrompt').value = localStorage.getItem('vision_system');
        if(localStorage.getItem('enhancer_system')) document.getElementById('enhancerSystemPrompt').value = localStorage.getItem('enhancer_system');
        document.getElementById('apiKeyInput').value = API_KEY;

        if (!API_KEY) {
            openSettings();
            document.getElementById('statusText').innerText = "Enter API Key in Settings";
        } else {
            // Fetch models immediately if key exists
            fetchModels();
        }
    });

    // --- SETTINGS LOGIC ---
    function openSettings() {
        document.getElementById('settingsModal').classList.add('active');
        if(API_KEY) fetchModels();
    }

    function saveAndCloseSettings() {
        API_KEY = document.getElementById('apiKeyInput').value;
        localStorage.setItem('nanogpt_key', API_KEY);
        localStorage.setItem('vision_system', document.getElementById('visionSystemPrompt').value);
        localStorage.setItem('enhancer_system', document.getElementById('enhancerSystemPrompt').value);
        saveSelectedModels(); // Save dropdown states
        
        document.getElementById('settingsModal').classList.remove('active');
        alert("Settings Saved");
    }

    function saveSelectedModels() {
        // Simple debounce or just save on change
        localStorage.setItem('sel_vision', document.getElementById('visionModelSelect').value);
        localStorage.setItem('sel_enhancer', document.getElementById('enhancerModelSelect').value);
        localStorage.setItem('sel_image', document.getElementById('imageModelSelect').value);
    }

    // --- MODEL FETCHING ---
    async function fetchModels() {
        const visionSelect = document.getElementById('visionModelSelect');
        const enhancerSelect = document.getElementById('enhancerModelSelect');
        const imageSelect = document.getElementById('imageModelSelect');
        const uncensoredChecked = document.getElementById('enhancerUncensored').checked;
        const nsfwChecked = document.getElementById('imageNsfw').checked;

        // Temporary loading state
        visionSelect.innerHTML = '<option value="">Loading...</option>';
        enhancerSelect.innerHTML = '<option value="">-- Disabled --</option>';
        imageSelect.innerHTML = '<option value="">Loading...</option>';

        try {
            // 1. Fetch Text/Vision Models
            const textResp = await fetch(`${BASE_URL}/v1/models?detailed=true`, {
                headers: { 'Authorization': `Bearer ${API_KEY}` }
            });
            const textData = await textResp.json();
            allTextModels = textData.data || [];

            // Populate Vision (Filter: capabilities.vision == true)
            let visionHTML = '';
            allTextModels.filter(m => m.capabilities?.vision).forEach(m => {
                visionHTML += `<option value="${m.id}">${m.name || m.id}</option>`;
            });
            visionSelect.innerHTML = visionHTML;

            // Populate Enhancer (Filter: Text models. Optional: category='uncensored')
            let enhancerHTML = '<option value="">-- Disabled --</option>';
            allTextModels.filter(m => {
                // Logic: It's a text model if it has completions capability or lacks image_generation
                const isText = !m.capabilities?.image_generation;
                if(!isText) return false;
                if(uncensoredChecked) return m.category === 'uncensored';
                return true;
            }).forEach(m => {
                enhancerHTML += `<option value="${m.id}">${m.name || m.id}</option>`;
            });
            enhancerSelect.innerHTML = enhancerHTML;

            // 2. Fetch Image Models
            const imgResp = await fetch(`${BASE_URL}/v1/image-models?detailed=true`, {
                headers: { 'Authorization': `Bearer ${API_KEY}` }
            });
            const imgData = await imgResp.json();
            allImageModels = imgData.data || [];

            let imageHTML = '';
            allImageModels.filter(m => {
                if(nsfwChecked) return m.capabilities?.nsfw === true;
                return true; // If unchecked, show all
            }).forEach(m => {
                imageHTML += `<option value="${m.id}">${m.name || m.id}</option>`;
            });
            imageSelect.innerHTML = imageHTML;

            // Restore previous selections if they exist
            if(localStorage.getItem('sel_vision')) visionSelect.value = localStorage.getItem('sel_vision');
            if(localStorage.getItem('sel_enhancer')) enhancerSelect.value = localStorage.getItem('sel_enhancer');
            if(localStorage.getItem('sel_image')) {
                imageSelect.value = localStorage.getItem('sel_image');
                updateResolutions(); // Update resolutions dropdown
            }

        } catch (err) {
            console.error(err);
            visionSelect.innerHTML = '<option value="">Error Loading</option>';
            imageSelect.innerHTML = '<option value="">Error Loading</option>';
        }
    }

    function updateResolutions() {
        const modelId = document.getElementById('imageModelSelect').value;
        const resSelect = document.getElementById('resolutionSelect');
        saveSelectedModels();

        if (!modelId) {
            resSelect.innerHTML = '<option value="">Select Model</option>';
            return;
        }

        // Find model in cached list
        const model = allImageModels.find(m => m.id === modelId);
        
        if (model && model.supported_parameters?.resolutions) {
            const resList = model.supported_parameters.resolutions;
            resSelect.innerHTML = resList.map(r => `<option value="${r}">${r}</option>`).join('');
            
            // Try to restore saved resolution or default to first
            const savedRes = localStorage.getItem('sel_resolution');
            if (savedRes && resList.includes(savedRes)) {
                resSelect.value = savedRes;
            }
        } else {
            resSelect.innerHTML = '<option value="1024x1024">1024x1024 (Default)</option>';
        }
    }

    // --- IMAGE HANDLING ---
    function handleImageUpload(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            document.getElementById('workspace').style.display = 'flex';
            document.querySelector('.upload-box').style.display = 'none';
            document.getElementById('originalPreview').src = e.target.result;
            currentImageDataUrl = e.target.result; 
        };
        reader.readAsDataURL(file);
    }

    // --- WORKFLOW ---
    async function runFullFlow() {
        if(!API_KEY) { alert("Enter API Key"); return; }

        const btn = document.getElementById('actionBtn');
        const status = document.getElementById('statusText');
        const promptArea = document.getElementById('promptArea');
        
        const visionModel = document.getElementById('visionModelSelect').value;
        const enhancerModel = document.getElementById('enhancerModelSelect').value;
        const imageModel = document.getElementById('imageModelSelect').value;
        const resolution = document.getElementById('resolutionSelect').value || '1024x1024';

        const visionSys = document.getElementById('visionSystemPrompt').value;
        const enhancerSys = document.getElementById('enhancerSystemPrompt').value;

        if(!visionModel || !imageModel) { alert("Please select Vision and Image models in Settings."); return; }

        btn.disabled = true;
        let currentPrompt = "";

        try {
            // --- STEP 1: VISION ---
            status.innerText = "Step 1/3: Analyzing Image...";
            promptArea.value = "Analyzing...";

            const visionPayload = {
                model: visionModel,
                messages: [
                    { role: 'system', content: visionSys },
                    { role: 'user', content: [
                        { type: 'text', text: "Process this image." },
                        { type: 'image_url', image_url: { url: currentImageDataUrl } }
                    ]}
                ]
            };

            const visionResp = await fetch(`${BASE_URL}/v1/chat/completions`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${API_KEY}` },
                body: JSON.stringify(visionPayload)
            });
            const visionData = await visionResp.json();
            if (!visionResp.ok) throw new Error(visionData.error?.message);
            
            currentPrompt = visionData.choices[0].message.content;
            promptArea.value = currentPrompt;

            // --- STEP 2: ENHANCER (If selected) ---
            if (enhancerModel) {
                status.innerText = "Step 2/3: Enhancing Prompt...";
                
                const enhancePayload = {
                    model: enhancerModel,
                    messages: [
                        { role: 'system', content: enhancerSys },
                        { role: 'user', content: currentPrompt }
                    ]
                };

                const enhanceResp = await fetch(`${BASE_URL}/v1/chat/completions`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${API_KEY}` },
                    body: JSON.stringify(enhancePayload)
                });
                const enhanceData = await enhanceResp.json();
                if (!enhanceResp.ok) throw new Error(enhanceData.error?.message);

                currentPrompt = enhanceData.choices[0].message.content;
                promptArea.value = currentPrompt; // Update UI
            }

            // --- STEP 3: IMAGE GENERATION ---
            status.innerText = "Step 3/3: Generating Image...";

            const imagePayload = {
                model: imageModel,
                prompt: currentPrompt,
                nImages: 1,
                resolution: resolution,
                showExplicitContent: true, // Always send true for your use case
                imageDataUrls: [ currentImageDataUrl ]
            };

            const imageResp = await fetch(`${BASE_URL}/v1/images/generations`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${API_KEY}` },
                body: JSON.stringify(imagePayload)
            });
            const imageData = await imageResp.json();
            if (!imageResp.ok) throw new Error(imageData.error?.message);

            const imageUrl = imageData.data[0].url;
            addToGallery(imageUrl);
            status.innerText = "Done!";

        } catch (error) {
            console.error(error);
            status.innerText = "Error: " + error.message;
            promptArea.value = "Error generating prompt.";
        } finally {
            btn.disabled = false;
        }
    }

    function addToGallery(url) {
        const gallery = document.getElementById('gallery');
        const img = document.createElement('img');
        img.src = url;
        img.className = 'gallery-item';
        img.onclick = () => window.open(url, '_blank');
        gallery.prepend(img);
    }

    function resetApp() {
        document.getElementById('workspace').style.display = 'none';
        document.querySelector('.upload-box').style.display = 'block';
        document.getElementById('fileInput').value = "";
        document.getElementById('promptArea').value = "";
        document.getElementById('statusText').innerText = "Ready";
        currentImageDataUrl = null;
    }
</script>
</body>
</html>
